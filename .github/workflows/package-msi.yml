name: Package MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"
      accept_wix_osmf_eula:
        description: "I accept the WiX Toolset OSMF EULA for this build"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package-msi:
    name: Build GPMI MSI
    runs-on: windows-latest

    steps:
      - name: Check WiX EULA acceptance
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.accept_wix_osmf_eula }}" -ne "true") {
            Write-Error "WiX v7 requires explicit OSMF EULA acceptance. Re-run this workflow with accept_wix_osmf_eula checked."
          }

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          "GPMI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GPMI_MSI=GPMI-$version.msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved version: $version"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure WiX
        shell: pwsh
        run: |
          wix eula accept wix7
          wix extension add WixToolset.UI.wixext

      - name: Build MSI
        shell: cmd
        run: package-gpmi-msi.cmd %GPMI_VERSION%

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPMI-${{ env.GPMI_VERSION }}-msi
          path: dist/${{ env.GPMI_MSI }}
          if-no-files-found: error

      - name: Upload MSI to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.GPMI_MSI }}
          fail_on_unmatched_files: true
