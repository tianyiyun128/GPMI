name: Package MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"
      accept_wix_osmf_eula:
        description: "I accept the WiX Toolset OSMF EULA for this build"
        required: true
        type: boolean
        default: false

jobs:
  package-msi:
    name: Build GPMI MSI
    runs-on: windows-latest

    steps:
      - name: Check WiX EULA acceptance
        shell: pwsh
        run: |
          if ("${{ inputs.accept_wix_osmf_eula }}" -ne "true") {
            Write-Error "WiX v7 requires explicit OSMF EULA acceptance. Re-run this workflow with accept_wix_osmf_eula checked."
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure WiX
        shell: pwsh
        run: |
          wix eula accept wix7
          wix extension add WixToolset.UI.wixext

      - name: Build MSI
        shell: cmd
        run: package-gpmi-msi.cmd ${{ inputs.version }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPMI-${{ inputs.version }}-msi
          path: dist/GPMI-${{ inputs.version }}.msi
          if-no-files-found: error
